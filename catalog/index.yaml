# Single agent catalog: short index (always loaded; card detail on demand).
# Epic TASK-2026-00187. Content language: en (the planner reads it).
# Departments (TASK-2026-00244): responsibility groups for the planner.
# They grant no permissions and add no directors or routers.
version: 1
departments:
  - name: engineering
    summary: Builds, deploys and maintains company repos and systems.
  - name: finance
    summary: Answers and records dated company money against ERPNext.
  - name: research
    summary: Runs grounded research on demand for company work.
  - name: operations
    summary: Runs company operations, coordination and messaging.
agents:
  - name: dev
    summary: Writes, deploys and maintains repos. Never decides business work or moves real money.
    card: agents/dev.yaml
  - name: owner
    summary: Decides, approves, answers and does. Never receives plans.
    card: agents/owner.yaml
  - name: operations
    summary: Creates company projects end to end.
    card: agents/operations.yaml
  - name: secretary
    summary: Sends email and coordinates lightly.
    card: agents/secretary.yaml
  - name: finance
    summary: Answers and records dated finance against ERPNext, never executes a transfer by itself.
    card: agents/finance.yaml
  - name: research
    summary: Runs grounded research on demand through the ticket bridge.
    card: agents/research.yaml
