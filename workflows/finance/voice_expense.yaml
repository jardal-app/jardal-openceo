workflow: finance.register_expense
name: Registro de gasto ocasional por voz
agent: finance
description: Registra un gasto ocasional dictado por voz o chat como asiento de diario idempotente en Jardal ERP. Sin tickets por gasto.
auto_match: true
triggers:
  - registra gasto
  - registrar gasto
  - anota gasto
  - pago de luz de casa
  - gasto personal
steps:
  - id: register_expense
    tool: finance.register_expense
    params:
      text: "{{task.description}}"
