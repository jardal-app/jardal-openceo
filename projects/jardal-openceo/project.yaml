project:
  number: 1
  name: jardal-openceo
  repos:
    - name: openceo
      url: git@github.com:Jardal/jardal-openceo.git
      branch_base: main
      local_path: /home/develop/development/Jardal/jardal-openceo

dev:
  # Tier S design §3/§15: no dev.coding_tool (routing is per-task) and no
  # dev.tier_s (roles and pool are global in config_loader.py).
  default_provider: muse
  branch_pattern: "{session_id}-{slug}"
  auto_push: false
  create_pr: true
  pr_body: auto
  # Tier S v2 (F1/F2): merge policy + orchestrator gates (design §11/§12).
  auto_merge: true
  budget_exclude: []
  gates:
    - { name: compile, cmd: "python3 -m py_compile openceo-core/main.py openceo-core/first_layer.py openceo-core/project_service.py openceo-core/db/mongo.py", timeout_minutes: 5, required: true }
    - { name: tier_s_focused, cmd: "./.venv/bin/python -m pytest tests/test_tier_s_contract.py tests/test_tier_s_final.py -q", timeout_minutes: 15, required: true }
  # How the orchestrator RUNS a frozen oracle after the build (policy §24,
  # TASK-2026-00178): {refs} expands to the shell-quoted oracle refs
  # (path or path::node). Without it a frozen oracle is hash-protected only.
  oracle_cmd: "./.venv/bin/python -m pytest {refs} -q"
  oracle_timeout_minutes: 15
  # Vault location for Tier S knowledge notes (design §9.8, F7b).
  vault_project:
    dir: /home/develop/development/Jardal/jardal-knowledge/vault
    project: projects/jardal/jardal-openceo

  providers:
    codex:
      command: ["/home/develop/.local/bin/codexj"]
      cwd: /home/develop/development/Jardal/jardal-openceo
      env: {}

    claude:
      command: ["/home/develop/.local/bin/claudej"]
      cwd: /home/develop/development/Jardal/jardal-openceo
      env: {}

    muse:
      command: ["/home/develop/.local/bin/musej"]
      cwd: /home/develop/development/Jardal/jardal-openceo
      env: {}

    gemini:
      command: ["/home/develop/.local/bin/agyd"]
      cwd: /home/develop/development/Jardal/jardal-openceo
      env: {}

    opencode:
      command: ["/home/develop/.opencode/bin/opencode", "-m", "deepseek/deepseek-reasoner"]
      cwd: /home/develop/development/Jardal/jardal-openceo
      env: {}

  qa:
    playwright: skip
    confidence_threshold: 0.90
    max_retries: 2

voice:
  peer_programming:
    enabled: true
    require_project_selection: false

secretary:
  # Recipients the secretary may mail without the Owner (TASK-2026-00208):
  # exact addresses or @domain suffixes. Anything else locks.
  allowed_recipients:
    - "@jardal.app"

notifications: []

presets:
  review:
    number: 1
    prompt: "Revisa los cambios recientes en git diff, valida el cumplimiento estricto de las reglas de AGENTS.md y confirma que no haya errores de sintaxis ni regresiones."
    description: "Revisar git diff y reglas de AGENTS.md"
  test_fix:
    number: 2
    prompt: "Ejecuta las pruebas unitarias del proyecto y si alguna falla analiza el traceback y corrige el código hasta que todas pasen."
    description: "Ejecutar tests y autocorregir fallos"
  refactor:
    number: 3
    prompt: "Analiza el código reciente, simplifica y optimiza la lógica manteniendo total compatibilidad hacia atrás y estilo limpio."
    description: "Refactorizar y optimizar código reciente"
  sync_context:
    number: 4
    prompt: "Revisa el estado del proyecto y actualiza STATUS.md y el ticket ERPNext correspondiente con un resumen claro del trabajo realizado y estado vigente."
    description: "Sincronizar STATUS.md y ticket"
  security_audit:
    number: 5
    prompt: "Audita el código en busca de posibles vulnerabilidades, endpoints expuestos sin autenticación o fugas de configuración."
    description: "Auditoría de seguridad y endpoints"
