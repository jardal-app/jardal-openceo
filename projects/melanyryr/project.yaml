project:
  number: 4
  name: melanyryr
  repos:
    - name: melanyryr
      url: git@github-jardal:jardal-app/melanyryr.git
      branch_base: develop
      local_path: /home/develop/development/Jardal/melanyryr
    - name: MelanyRyR_react
      local_path: /home/develop/development/Jardal/melanyryr/MelanyRyR_react
    - name: MelanyRyR_rest
      local_path: /home/develop/development/Jardal/melanyryr/MelanyRyR_rest
    - name: MelanyRyR_pwa
      local_path: /home/develop/development/Jardal/melanyryr/MelanyRyR_pwa

dev:
  # Tier S design §3: no dev.coding_tool (routing is per-task).
  coding_tier: auto
  default_provider: muse
  branch_pattern: "{session_id}-{slug}"
  auto_push: false
  create_pr: true
  pr_body: auto

  providers:
    codex:
      command: ["/home/develop/.local/bin/codexf"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

    claude:
      command: ["/home/develop/.local/bin/claudej"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

    muse:
      command: ["/home/develop/.local/bin/muse"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

    gemini:
      command: ["/home/develop/.local/bin/agyd"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

    kimi:
      command: ["/home/develop/.local/bin/kimi"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

    opencode:
      command: ["/home/develop/.opencode/bin/opencode", "-m", "opencode-go/kimi-k2.6"]
      cwd: /home/develop/development/Jardal/melanyryr
      env: {}

  review_base_url: https://dev.melanyryr.jardal.app

  qa:
    playwright: skip
    confidence_threshold: 0.90
    max_retries: 2

voice:
  peer_programming:
    enabled: true
    require_project_selection: false

notifications: []

presets:
  review:
    prompt: "Revisa los cambios recientes en git diff del frontend y backend de melanyryr, valida componentes y estilos."
    description: "Revisar cambios de frontend y backend"
  test_fix:
    prompt: "Ejecuta los tests del proyecto y valida el build de React y PWA corrigiendo cualquier error."
    description: "Validar tests y build de React/PWA"
  sync_context:
    prompt: "Actualiza el estado de desarrollo y documentación de melanyryr."
    description: "Sincronizar documentación de melanyryr"

