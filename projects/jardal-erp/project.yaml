project:
  number: 6
  name: jardal-erp
  repos:
    - name: jardal-erp
      url: git@github-jardal:jardal-app/jardal-erp.git
      branch_base: main
      local_path: /home/develop/development/Jardal/jardal-erp

dev:
  default_provider: muse
  # Builder on the host user (TASK-2026-00481, Owner order): the pnpm/bun
  # toolchain, package store and Docker the repo tests need are not fully
  # available inside the bwrap fence. Reviewers and read-only roles keep
  # the fence; env still goes through the child allowlist.
  isolation: host
  branch_pattern: "{session_id}-{slug}"
  auto_push: false
  auto_merge: true
  # Post-merge production (TASK-2026-00415): v2 follows the versioned
  # release train in docs/RELEASE.md (manual, non-idempotent migrations);
  # the engine delivers to origin/main and never touches production.
  deploy:
    mode: none
  # Machine-written files never count toward the size budget (TASK-2026-00553):
  # the lockfile and drizzle-kit snapshots tripped the 800-line brake alone.
  budget_exclude:
    - "pnpm-lock.yaml"
    - "*/drizzle/meta/*"
  create_pr: true
  providers:
    muse:
      command: ["/home/develop/.local/bin/musej"]
      cwd: /home/develop/development/Jardal/jardal-erp
      env: {}
    codex:
      command: ["/home/develop/.local/bin/codexf"]
      cwd: /home/develop/development/Jardal/jardal-erp
      env: {}
    claude:
      command: ["/home/develop/.local/bin/claudej"]
      cwd: /home/develop/development/Jardal/jardal-erp
      env: {}
  # lint, web tests and the web build join typecheck (TASK-2026-00492):
  # all green on main@a6e96a9, so a ticket cannot merge a broken build.
  gates:
    - { name: typecheck, cmd: "bun run typecheck", timeout_minutes: 5, required: true }
    - { name: lint, cmd: "bun run lint", timeout_minutes: 5, required: true }
    - { name: web_test, cmd: "pnpm --filter @jardal/web test", timeout_minutes: 5, required: true }
    - { name: web_build, cmd: "pnpm --filter @jardal/web build", timeout_minutes: 5, required: true }
  oracle_cmd: "bun test {refs}"
  oracle_timeout_minutes: 10
  qa:
    playwright: skip

notifications: []
