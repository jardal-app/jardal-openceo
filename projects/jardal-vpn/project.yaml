project:
  number: 3
  name: jardal-vpn
  repos:
    - name: jardal-vpn
      local_path: /home/develop/development/Jardal/jardal-vpn

dev:
  coding_tier: auto
  default_provider: claude
  branch_pattern: "{session_id}-{slug}"
  auto_push: false
  create_pr: true
  pr_body: auto

  providers:
    codex:
      command: ["/home/develop/.local/bin/codex", "--dangerously-bypass-approvals-and-sandbox"]
      cwd: /home/develop/development/Jardal/jardal-vpn
      env: {}

    claude:
      command: ["/home/develop/.local/bin/claude", "--dangerously-skip-permissions", "--model", "opus", "--effort", "high"]
      cwd: /home/develop/development/Jardal/jardal-vpn
      env:
        ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6

  qa:
    playwright: skip
    confidence_threshold: 0.90
    max_retries: 2

voice:
  peer_programming:
    enabled: true
    require_project_selection: false

notifications: []

presets:
  review:
    prompt: "Revisa los cambios recientes en git diff de la VPN y confirma configuraciones seguras de WireGuard y firewall."
    description: "Revisar cambios de red y seguridad VPN"
  test_fix:
    prompt: "Verifica la conectividad de la VPN, scripts de validación y corrige cualquier error en las reglas."
    description: "Verificar conectividad y corregir fallos"
  sync_context:
    prompt: "Actualiza la documentación de arquitectura de red y estado de túneles VPN."
    description: "Sincronizar documentación de VPN"

