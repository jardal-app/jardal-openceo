project:
  number: 2
  name: jardal-trading
  repos:
    - name: jardal-trading
      local_path: /home/develop/development/Jardal/jardal-trading

dev:
  coding_tool: tier_s
  coding_tier: auto
  default_provider: claude
  branch_pattern: "{session_id}-{slug}"
  auto_push: false
  create_pr: true
  pr_body: auto
  tier_s:
    enabled: true
    review_rounds: 2  # Set to 1 for pilot/testing tickets to save reviewer tokens
    max_plans: 7  # Cap sub-plan fragmentation; planner should consolidate where safe
    timeout_minutes: 15
    opencode_reviewers:
      - label: kimi27c
        model: opencode-go/kimi-k2.7-code
      - label: qwen37
        model: opencode-go/qwen3.7-max
    roles:
      planner:
        provider: claude
        command: ["/home/develop/.local/bin/clauded"]
      plan_reviewer:
        provider: codex
        command: ["/home/develop/.local/bin/codexf", "-m", "gpt-5.5", "-c", "model_reasoning_effort=xhigh"]
      builder:
        provider: claude
        command: ["/home/develop/.local/bin/claudep"]
      gemini_reviewer:
        provider: gemini
        command: ["/home/develop/.local/bin/agyd"]

  providers:
    codex:
      command: ["/home/develop/.local/bin/codex", "--dangerously-bypass-approvals-and-sandbox", "-m", "gpt-5.5", "-c", "model_reasoning_effort=xhigh"]
      cwd: /home/develop/development/Jardal/jardal-trading
      env: {}

    claude:
      command: ["/home/develop/.local/bin/claude", "--dangerously-skip-permissions", "--model", "opus", "--effort", "high"]
      cwd: /home/develop/development/Jardal/jardal-trading
      env:
        ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6

    gemini:
      command: ["/home/develop/.local/bin/agyd"]
      cwd: /home/develop/development/Jardal/jardal-trading
      env: {}

    opencode:
      command: ["/home/develop/.opencode/bin/opencode", "-m", "deepseek/deepseek-reasoner"]
      cwd: /home/develop/development/Jardal/jardal-trading
      env: {}

  qa:
    playwright: skip
    confidence_threshold: 0.90
    max_retries: 2

voice:
  peer_programming:
    enabled: true
    require_project_selection: false

notifications: []

presets:
  review:
    prompt: "Revisa los cambios recientes en git diff de jardal-trading y verifica la correcta gestión de riesgo y manejo de órdenes."
    description: "Revisar cambios y gestión de riesgo"
  test_fix:
    prompt: "Ejecuta las pruebas del bot de trading y si alguna falla corrige el código de las estrategias o conectores."
    description: "Ejecutar tests del bot y corregir fallos"
  backtest_check:
    prompt: "Verifica los resultados del último backtest y reporta métricas clave de drawdown, win rate y Sharpe ratio."
    description: "Analizar métricas de backtest"
  sync_context:
    prompt: "Actualiza la documentación del bot y el estado de estrategias en el repositorio."
    description: "Sincronizar documentación del bot"


